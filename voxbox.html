function migrarPresets(entradas,{grupoPadrao='',usuario=false}={}){
 const relatorio={lidos:entradas.length,grupos:[],semPrefixo:[],ambiguos:[]};
 const migrados=entradas.map((entrada,indice)=>{
  const original=String(entrada.name||entrada.nome||'').trim();let nome=original,grupo=String(entrada.group||grupoPadrao),artista=String(entrada.artist||entrada.author||entrada.metadata?.artist||'');
  const colchetes=nome.match(/^\[([^\]]+)\]\s*(.*)$/),separador=nome.match(/^(.+?)(?:\s+-\s+|_)(.+)$/);
  const prefixo=colchetes||separador;
  if(prefixo){if(entrada.group&&entrada.group!==prefixo[1].trim())relatorio.ambiguos.push(original);grupo=prefixo[1].trim();nome=prefixo[2].trim();if(/^\[/.test(nome))relatorio.ambiguos.push(original)}else relatorio.semPrefixo.push(original);
  if(!nome){nome=original||'Sem nome';relatorio.ambiguos.push(original)}
  const autor=nome.match(/\s+(?:by|@)\s+(.+)$/i);if(!artista&&autor)artista=autor[1].trim();
  const tags=Array.isArray(entrada.tags)?[...entrada.tags]:[];
  const regras=[[/\b(drum|drums|kick|snare|overheads?)\b/i,'Drums'],[/\b(vocal|vocals|vox|voice|bgvs?)\b/i,'Vocal'],[/\bbass\b/i,'Bass'],[/\bdark\b/i,'Dark'],[/\bbright\b/i,'Bright'],[/\bheavy\b/i,'Heavy'],[/\blight\b/i,'Light'],[/\b(comp|compression|compressor)\b/i,'Compressor'],[/de[-\s]?ess/i,'De-Ess'],[/\b(lim|limiter|limiting)\b/i,'Limiter'],[/\b(sat|saturated|saturation)\b/i,'Saturated']];
  for(const [regra,tag]of regras)if(regra.test(nome))tags.push(tag);
  const parametros=entrada.params||entrada.settings||null;
  return {id:String(entrada.id||('import-'+Date.now()+'-'+indice+'-'+Math.random().toString(36).slice(2,7))),name:nome,group:grupo,tags:unicas([...tags,grupo]),artist:artista,favorite:!!entrada.favorite,isUser:entrada.isUser??(entrada.factory===undefined?usuario:!entrada.factory),settings:parametros?{...parametros}:null};
 });
 relatorio.grupos=unicas(migrados.map(p=>p.group));relatorio.ambiguos=unicas(relatorio.ambiguos);relatorioImportacao=relatorio;
 console.info('Migração de presets:',JSON.stringify(relatorio));return {presets:migrados,relatorio};
}

// API de migração: aceita JSON, array ou {presets:[...]}; não inventa parâmetros ausentes.
window.voxbox.importPresets=function(dados,opcoes={}){
 if(typeof dados==='string')dados=JSON.parse(dados);const entradas=Array.isArray(dados)?dados:dados?.presets;
 if(!Array.isArray(entradas))throw new TypeError('Informe um array ou {presets:[...]}');
 for(const p of entradas){if(!p||typeof(p.name||p.nome)!=='string')throw new TypeError('Cada preset precisa de nome');const parametros=p.params||p.settings;if(parametros)for(const [id,v]of Object.entries(parametros))if(!Object.hasOwn(defaults,id)||!Number.isFinite(v))throw new TypeError('Parâmetro inválido: '+id)}
 const resultado=migrarPresets(entradas,{grupoPadrao:opcoes.group||'VOXBOX',usuario:true});
 for(const p of resultado.presets){if(p.settings)for(const [id,valor]of Object.entries(p.settings)){const c=controls.get(id);if(c){const v=Math.max(c.min,Math.min(c.max,valor));p.settings[id]=c.steps?c.min+Math.round((v-c.min)/c.steps)*c.steps:v}else p.settings[id]=valor?1:0}const indice=library.findIndex(item=>item.id===p.id||(item.name===p.name&&item.group===p.group));if(indice>=0){p.id=library[indice].id;p.tags=unicas([...library[indice].tags,...p.tags]);p.favorite=library[indice].favorite;if(!p.settings)p.settings=library[indice].settings;if(!library[indice].isUser){library[indice].tags=p.tags;if(p.artist)library[indice].artist=p.artist}else library[indice]=p}else library.push(p)}
 persistirBiblioteca();drawLibrary();return structuredClone(resultado.relatorio);
};

// Knob compartilhado: luz fixa; estrias e inserto acompanham o ângulo.
function pintarKnob(contexto,tamanho,angulo){
 const fator=tamanho/64,centro=44*fator,raio=31*fator;
 contexto.save();contexto.clearRect(0,0,88*fator,88*fator);
 contexto.shadowColor='rgba(0,0,0,.62)';contexto.shadowBlur=9*fator;contexto.shadowOffsetX=3*fator;contexto.shadowOffsetY=5*fator;
 contexto.fillStyle='#09090b';contexto.beginPath();contexto.ellipse(centro,centro+3*fator,raio,raio,0,0,Math.PI*2);contexto.fill();
 contexto.shadowBlur=2*fator;contexto.shadowOffsetX=fator;contexto.shadowOffsetY=2*fator;contexto.shadowColor='rgba(0,0,0,.85)';
 let gradiente=contexto.createLinearGradient(centro-raio,centro-raio,centro+raio,centro+raio);gradiente.addColorStop(0,'#515156');gradiente.addColorStop(.25,'#202023');gradiente.addColorStop(.7,'#08080a');gradiente.addColorStop(1,'#151517');contexto.fillStyle=gradiente;contexto.beginPath();contexto.arc(centro,centro+2*fator,raio,0,Math.PI*2);contexto.fill();contexto.shadowColor='transparent';
 for(let i=0;i<100;i++){
  const a=i*Math.PI*2/100+angulo,luz=(Math.cos(a+Math.PI/4)+1)/2;
  const externo=raio*.98,interno=raio*.85;
  contexto.strokeStyle=`rgba(${Math.round(35+luz*65)},${Math.round(35+luz*65)},${Math.round(39+luz*65)},${.25+luz*.45})`;contexto.lineWidth=.65*fator;
  contexto.beginPath();contexto.moveTo(centro+Math.sin(a)*interno,centro-Math.cos(a)*interno-2*fator);contexto.lineTo(centro+Math.sin(a)*externo,centro-Math.cos(a)*externo+2*fator);contexto.stroke();
 }
 gradiente=contexto.createRadialGradient(centro-8*fator,centro-13*fator,2*fator,centro,centro,raio*.9);gradiente.addColorStop(0,'#303034');gradiente.addColorStop(.35,'#1a1a1d');gradiente.addColorStop(.8,'#131315');gradiente.addColorStop(1,'#08080b');contexto.fillStyle=gradiente;contexto.beginPath();contexto.arc(centro,centro-2*fator,raio*.86,0,Math.PI*2);contexto.fill();
 contexto.save();contexto.beginPath();contexto.arc(centro,centro-2*fator,raio*.855,0,Math.PI*2);contexto.clip();
 for(let i=0;i<800;i++){const x=((i*193+37)%997)/997*raio*2+centro-raio,y=((i*397+71)%991)/991*raio*2+centro-raio;contexto.fillStyle=i%2?'rgba(255,255,255,.026)':'rgba(0,0,0,.035)';contexto.fillRect(x,y,.55*fator,.55*fator)}
 contexto.restore();contexto.strokeStyle='rgba(150,150,157,.23)';contexto.lineWidth=1.1*fator;contexto.beginPath();contexto.arc(centro,centro-2*fator,raio*.84,Math.PI*1.05,Math.PI*1.64);contexto.stroke();
 const dx=Math.sin(angulo),dy=-Math.cos(angulo);contexto.lineCap='round';contexto.shadowColor='rgba(0,0,0,.9)';contexto.shadowBlur=1.2*fator;contexto.shadowOffsetX=.8*fator;contexto.shadowOffsetY=.8*fator;contexto.strokeStyle='#f2efe6';contexto.lineWidth=2*fator;contexto.beginPath();contexto.moveTo(centro+dx*3*fator,centro-2*fator+dy*3*fator);contexto.lineTo(centro+dx*25*fator,centro-2*fator+dy*25*fator);contexto.stroke();contexto.restore();
}
window.voxbox.pintarKnob=pintarKnob;
function prepararPele(c){const tela=document.createElement('canvas');const extensao=c.size*88/64;tela.width=tela.height=264;tela.style.cssText=`position:absolute;width:${extensao}px;height:${extensao}px;left:${(c.size-extensao)/2}px;top:${(c.size-extensao)/2}px;pointer-events:none`;c.el.replaceChildren(tela);c.tela=tela;c.anguloVisual=c.start+(c.end-c.start)*(state[c.id]-c.min)/(c.max-c.min);c.el.addEventListener('contextmenu',ev=>{ev.preventDefault();abrirValorKnob(c)});c.el.addEventListener('pointerdown',ev=>{if(ev.ctrlKey){ev.stopImmediatePropagation();ev.preventDefault();abrirValorKnob(c)}},true)}
function abrirValorKnob(c){const janela=document.querySelector('#knobValueDialog'),campo=document.querySelector('#knobValue');janela.dataset.id=c.id;document.querySelector('#knobValueTitle').textContent=c.name;campo.min=c.min;campo.max=c.max;campo.step=c.steps||.01;campo.value=state[c.id];janela.showModal();campo.focus();campo.select()}
for(const c of controls.values())if(!c.toggle)prepararPele(c);
document.querySelector('#cancelKnobValue').onclick=()=>document.querySelector('#knobValueDialog').close();
document.querySelector('#knobValueForm').onsubmit=ev=>{ev.preventDefault();const janela=document.querySelector('#knobValueDialog'),campo=document.querySelector('#knobValue'),c=controls.get(janela.dataset.id);if(c&&campo.reportValidity()){commit(c,Number(campo.value));janela.close()}};
let instanteKnobs=0;function animarKnobs(agora){const dt=Math.min(.05,(agora-instanteKnobs)/1000||.016);instanteKnobs=agora;for(const c of controls.values())if(c.tela){const alvo=c.start+(c.end-c.start)*(state[c.id]-c.min)/(c.max-c.min);c.anguloVisual+=(alvo-c.anguloVisual)*(1-Math.exp(-dt*24));if(c.ultimoAngulo===undefined||Math.abs(c.anguloVisual-c.ultimoAngulo)>.005){const ctx=c.tela.getContext('2d');ctx.setTransform(3,0,0,3,0,0);pintarKnob(ctx,64,c.anguloVisual*Math.PI/180);c.ultimoAngulo=c.anguloVisual}}requestAnimationFrame(animarKnobs)}requestAnimationFrame(animarKnobs);

// A spring-damped movement models ballistic VU response without an audio dependency.
let angle=-48,velocity=0,previous=0;function animate(ms){const dt=Math.min(.04,(ms-previous)/1000||.016);previous=ms;const t=ms/1000;let target=-49;if(state.power&&!state.bypass){const signal=.52+.18*Math.sin(t*2.8)+.12*Math.sin(t*7.3)+.06*Math.sin(t*19);target=[-40+signal*75+(state.input-5)*2,-45+signal*state.threshold*9,-35+signal*65+state.hiPeak,-45+signal*state.deThreshold*8][state.meter]}velocity+=(target-angle)*90*dt;velocity*=Math.exp(-12*dt);angle+=velocity*dt;document.querySelector('#needle').style.transform=`rotate(${angle}deg)`;requestAnimationFrame(animate)}requestAnimationFrame(animate);
